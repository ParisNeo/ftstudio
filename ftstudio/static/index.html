<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ftstudio</title>
<style>
:root{--paper:#eef1f4;--panel:#fbfcfd;--ink:#16212c;--mut:#667585;--line:#d5dce3;--steel:#25607f;--amber:#c97a00;--moss:#3b7d4f;--brick:#b4443a;
--sans:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans);display:grid;grid-template-rows:auto 1fr}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
header{display:flex;align-items:center;gap:20px;padding:10px 20px;background:var(--ink);color:#e8edf2}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
#lane{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
#lane .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
#bar{flex:1;height:6px;border-radius:3px;background:#2c3b49;overflow:hidden;min-width:60px}
#bar i{display:block;height:100%;width:30%;background:var(--amber);border-radius:3px;animation:sweep 1.6s ease-in-out infinite alternate}
#bar.idle i{animation:none;width:0}
@keyframes sweep{from{margin-left:0}to{margin-left:70%}}
@media (prefers-reduced-motion:reduce){#bar i{animation:none;margin-left:35%}}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--steel)}.btn.pri{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.bad{color:var(--brick)}
.helpbtn{background:none;border:0;color:#c8d6e2;cursor:pointer;padding:0;font:inherit;font-size:13px}
.helpbtn:hover{color:#fff}
main{display:grid;grid-template-columns:320px 1fr;min-height:0}
#list{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
.job{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.job:hover{background:#f2f5f8}.job[aria-current=true]{background:#e4edf3;box-shadow:inset 3px 0 var(--steel)}
.job b{font-weight:600}.job small{color:var(--mut);grid-column:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--mut)}
.s-running .dot{background:var(--amber)}.s-succeeded .dot{background:var(--moss)}.s-failed .dot{background:var(--brick)}.s-cancelled .dot,.s-cancelling .dot{background:#9aa5b1}
#detail{display:grid;grid-template-rows:auto auto 1fr;min-width:0;min-height:0}
#dhead{padding:16px 24px 8px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
#dhead h2{margin:0;font-size:20px}#dhead .meta{color:var(--mut);flex:1}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;color:#fff;background:var(--mut)}
.pill.running{background:var(--amber)}.pill.succeeded{background:var(--moss)}.pill.failed{background:var(--brick)}
#tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line)}
#tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent}
#tabs button[aria-selected=true]{color:var(--ink);border-color:var(--steel);font-weight:600}
.pane{overflow:auto;padding:18px 24px;min-height:0}
pre{margin:0;font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
#log:empty::before{content:"Starting. Loading Python libraries can take 20 to 30 seconds before the first line appears.";color:#8fa0b0}
#log{background:var(--ink);color:#d9e2ea;padding:14px 16px;border-radius:8px;height:100%;overflow:auto}
.cards{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:130px}
.card b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.card span{color:var(--mut)}.card i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
table{border-collapse:collapse;margin-bottom:18px}td,th{padding:4px 18px 4px 0;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:500}
h3{font-size:15px;margin:18px 0 8px}
.empty{color:var(--mut);padding:40px 24px;max-width:46ch}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;width:min(560px,94vw);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(22,33,44,.45)}
dialog form{padding:20px 24px;display:grid;gap:12px}
dialog label{display:grid;gap:4px;color:var(--mut);font-size:13px}
dialog input,dialog select,dialog textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink)}
dialog textarea{font:12.5px/1.4 var(--mono);min-height:54px}
.row{display:flex;gap:8px;justify-content:flex-end;align-items:center}.err{color:var(--brick);flex:1;font-size:13px}
@media(max-width:760px){main{grid-template-columns:1fr}#list{max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}}
.brand{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}
dialog small{color:var(--mut);font-size:12px}dialog details{color:var(--mut);font-size:13px}dialog summary{cursor:pointer;margin-bottom:6px}dialog form{max-height:86vh;overflow:auto}
.guide{padding:28px 32px;max-width:700px}.guide h2{margin:0 0 6px}.guide ol{list-style:none;padding:0;margin:20px 0;display:grid;gap:10px}
.guide li{display:flex;justify-content:space-between;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.guide li.next{border-color:var(--steel);box-shadow:inset 3px 0 var(--steel)}.guide li.done b::before{content:"Done: ";color:var(--moss)}
.guide li span{color:var(--mut);margin-left:10px;font-size:12px}.guide p{margin:4px 0 0;color:var(--mut)}.btn:disabled{opacity:.45;cursor:default}

/* Field help tooltip (pure CSS, no JS) */
.lrow{display:flex;align-items:center;gap:0}
.fh{display:inline-flex;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:help;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-left:6px;position:relative;user-select:none}
.fh:hover{background:var(--steel);color:#fff;border-color:var(--steel)}
.fh::after{content:attr(data-tip);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);width:260px;background:var(--ink);color:#e8edf2;padding:10px 14px;border-radius:8px;font-size:12px;line-height:1.55;font-weight:400;text-align:left;white-space:normal;box-shadow:0 4px 18px rgba(0,0,0,.28);pointer-events:none;opacity:0;visibility:hidden;transition:opacity .15s;z-index:300}
.fh:hover::after{opacity:1;visibility:visible}

/* Help panel */
.helpsc{padding:32px 40px;max-width:780px;line-height:1.65;font-size:14px;overflow:auto;height:100%}
.helpsc h2{font-size:22px;margin:0 0 4px}
.helpsc h3{font-size:16px;margin:28px 0 6px;color:var(--steel)}
.helpsc h4{font-size:14px;margin:16px 0 4px}
.helpsc p{margin:4px 0 10px}
.helpsc code{background:#e4e9ee;padding:2px 6px;border-radius:4px;font:12.5px/1.4 var(--mono)}
.helpsc ul,.helpsc ol{padding-left:22px}
.helpsc li{margin-bottom:4px}
.helpsc table td,.helpsc table th{padding:6px 14px 6px 0}
.gform-help{background:#f0f5f9;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:4px;font-size:13px;line-height:1.6}
.gform-help h4{margin:0 0 5px;font-size:14px;color:var(--steel)}
.gform-help p{margin:0}
</style></head><body>
<header><h1><button id="home" class="brand" title="Back to the start page">ftstudio</button></h1>
<div id="lane"><div class="txt" id="lanetxt">GPU idle</div><div id="bar" class="idle"><i></i></div><div class="txt" id="queued"></div></div>
<button class="helpbtn" id="helpbtn">? Help</button>
<button class="btn pri" id="new">New job</button></header>
<main>
<nav id="list" aria-label="Jobs"></nav>
<section id="detail"></section></main>
<datalist id="bases"><option value="unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit">Llama 3.1 8B Instruct</option><option value="unsloth/Qwen2.5-7B-Instruct-bnb-4bit">Qwen 2.5 7B Instruct</option><option value="unsloth/mistral-7b-instruct-v0.3-bnb-4bit">Mistral 7B Instruct v0.3</option></datalist>
<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>
<script>
var $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});
var api=function(p,o){return fetch(p,o).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:JSON.stringify(j.detail||r.status));return j})})};
var base=function(p){return String(p||"").split(/[\\/]/).pop()};
var label=function(j){return j.kind==="eval"?base(j.params.gguf):j.kind==="train"?base(j.params.base_model):j.kind==="export"?"export "+(j.params.train_job||base(j.params.adapter_dir)):j.kind==="prep"?prepLabel(j.params):j.kind==="synth"?"entries for "+(j.params.library||"?"):j.kind==="fetch"?"download "+base(j.params.file||j.params.repo):j.kind};
var ago=function(t){var s=Math.max(0,Date.now()/1000-t);return s<60?Math.round(s)+"s":s<3600?Math.round(s/60)+"m":s<86400?Math.round(s/3600)+"h":Math.round(s/86400)+"d"};
var jobs=[],sel=null,ws=null,tab="log",shown="",showingHelp=false;

var KINDS=[["prep","Prepare my data"],["eval","Test a model"],["train","Train a model"],["export","Export to GGUF"]];
var SCHEMA={
 prep:[["inputs","Your data files","lines","/data/train.jsonl","Full path to each .jsonl, .json or .csv file, one per line. Each example needs a question and an answer; common layouts are detected for you.",1],["tokenizer","Model tokenizer","text","meta-llama/Llama-3.1-8B-Instruct","Use the model you will train, so the chat format matches. Needed for length limits and the format check."],["max_seq_len","Longest example allowed (tokens)","num","2048","Longer examples are removed, never cut. Roughly 4 characters per token."],["val_fraction","Share kept aside for checking","num","0.05","Examples the model never trains on. They show whether it is really learning. 0.05 means 5%."],["decontaminate_against","Your test files","lines","/data/my_tasks.jsonl","Anything that appears in these files is removed from training, so your test scores stay honest."],["columns.user","CSV only: question column","text",""],["columns.assistant","CSV only: answer column","text",""],["system_prompt","Default system prompt","text","","Added to examples that have none."]],
 eval:[["gguf","Model file (.gguf)","text","/models/base-Q4_K_M.gguf","The model to score. Test the original first, so you have numbers to beat.",1],["suites.perplexity.file","Text file for perplexity","text","/data/wiki.test.raw","Lower perplexity means the model predicts this text better. Compare before and after training."],["suites.custom.file","Your own test (JSONL)","text","/data/my_tasks.jsonl","One line per question with the expected answer. The best way to know if training helped you."],["suites.lm_eval.tasks","Public benchmarks","lines","gsm8k","Names like gsm8k (math). Slow, so also set an example limit."],["suites.lm_eval.limit","Public benchmark example limit","num","100"],["suites.lm_eval.tokenizer","Public benchmark tokenizer","text","","Needed when you run public benchmarks."]],
 train:[["dataset.job","Prepared data","ref:prep","","Pick a finished data-preparation job.",1],["base_model","Base model","text","unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit","The model to improve. Use the Instruct version, and the same family you prepared data with.",1],["max_seq_len","Longest example (tokens)","num","2048","Lower this first if you run out of memory."],["epochs","Passes over the data","num","1","1 is a good start. More passes can make the model memorize instead of learn."],["lora_r","Adapter size","num","16","Bigger learns more but uses more memory. 8 to 32 is typical."],["learning_rate","Learning speed","num","0.0002","Keep the default unless the loss curve jumps around."]],
 export:[["train_job","Finished training","ref:train","","Pick a finished training job.",1],["quantizations","Sizes to make","lines","q4_k_m","q4_k_m is small and good for most uses. q8_0 is bigger and closer to the original."],["auto_eval.custom.file","Then test: your own test (JSONL)","text","","If set, each exported file is tested automatically afterwards."],["auto_eval.perplexity.file","Then test: perplexity text file","text",""]]};
var setPath=function(o,k,v){var p=k.split("."),c=o;p.slice(0,-1).forEach(function(x){c=c[x]?c[x]:(c[x]={})});c[p[p.length-1]]=v};

var HELP={
 prep:{title:"Prepare Data",body:"Reads your raw data files, finds question-answer pairs, cleans them up, and splits into train and validation sets. Auto-detects Alpaca, ShareGPT, messages, prompt/completion and CSV formats. Writes train.jsonl and val.jsonl."},
 eval:{title:"Test a Model (Evaluate)",body:"Starts a GGUF model with llama.cpp and runs three tests: perplexity (lower = better at predicting text), your own JSONL benchmark (prompt vs expected answer), and optional public benchmarks like GSM8K. Test the base model first."},
 train:{title:"Train a Model",body:"Fine-tunes a base model using your prepared data, creating a small LoRA adapter (a few MB). Uses Unsloth on NVIDIA, PEFT on other GPUs/CPU, or MLX on Apple Silicon. Watch the loss curve in the Results tab."},

 "suites.lm_eval.limit":"Benchmark limit. Max examples per public benchmark to run.",
 "suites.lm_eval.tokenizer":"Benchmark tokenizer. Usually the same as the model tokenizer.",

 "auto_eval.perplexity.file":"Auto-test perplexity. Path to a plain text file for perplexity evaluation after export.",
 "server_url":"Running server. If you already have an OpenAI-compatible server (llama-server, vLLM, etc.), put its URL here.",
 "sources":"Raw documents or folders. Paths to documentation files (Markdown, RST, text, Python), one per line. Folders are searched recursively.",

};

 return '<select data-k="'+k+'" data-t="ref">'+(o.length?o.map(function(j){return '<option value="'+j.id+'">'+esc(label(j))+' ('+j.id+')</option>'}).join(""):'<option value="" disabled selected>No finished '+kind+' job yet. Do that step first.</option>')+'</select>'}
function field(arr){var k=arr[0],l=arr[1],t=arr[2],ph=arr[3],h=arr[4],rq=arr[5];

 var c=t.indexOf("ref:")===0?refSel(k,t.slice(4)):(t==="lines"?'<textarea '+a+'></textarea>':'<input '+a+(k==="base_model"||k==="tokenizer"?' list="bases"':"")+'>');
 return '<label><span class="lrow">'+esc(l)+fh+(rq?" (required)":"")+'</span>'+c+(h?'<small>'+esc(h)+'</small>':"")+'</label>'}

 var extra={};flat(pr.params).forEach(function(pair){var k=pair[0],v=pair[1];var el=f.querySelector('[data-k="'+k+'"]');if(el){el.value=Array.isArray(v)?v.join("\n"):v}else{setPath(extra,k,v)}});

 +(ps.length?'<label>Preset<select id="preset"><option value="">Custom</option>'+ps.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join("")+'</select><small id="pdesc">Pick one to fill in sensible values. You can still edit everything.</small></label>':"")
 +SCHEMA[kind].map(field).join("")
 +'<details><summary>Advanced: extra parameters (JSON)</summary><textarea id="extra" placeholder=\'{"port": 8090}\'></textarea></details><div class="row"><span class="err" id="ferr"></span><button type="button" class="btn" id="cancelf">Close</button><button class="btn pri" type="submit">Queue job</button></div>';
 f.querySelector("#kind").onchange=function(e){openForm(e.target.value)};

  var miss=SCHEMA[k].filter(function(x){return x[5]}).find(function(x){var el=f.querySelector('[data-k="'+x[0]+'"]');return !el||!el.value.trim()});
  if(miss){f.querySelector("#ferr").textContent="Fill in: "+miss[1];return}
  f.querySelectorAll("[data-k]").forEach(function(el){var v=el.value.trim();if(!v)return;
   if(el.getAttribute("data-t")==="lines")v=v.split("\n").map(function(s){return s.trim()}).filter(Boolean);else if(el.getAttribute("data-t")==="num")v=Number(v);setPath(params,el.getAttribute("data-k"),v)});
  try{var x=f.querySelector("#extra");var xv=x?x.value.trim():"";if(xv)Object.assign(params,JSON.parse(xv));
   api("/jobs",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({kind:k,params})}).then(function(r){$("#dlg").close();load().then(function(){pick(r.id)})}).catch(function(er){f.querySelector("#ferr").textContent=er.message})}catch(er){f.querySelector("#ferr").textContent=er instanceof SyntaxError?"The extra parameters are not valid JSON.":er.message}};
 if(!$("#dlg").open)$("#dlg").showModal();
}

 +'<p>FTStudio guides you through a four-step pipeline. Each step is a <b>job</b> that runs one at a time (jobs take turns on the GPU).</p>'

 +'<p>When preparing data, FTStudio auto-detects the layout of each line. The following formats are recognized:</p>'

 +'<li><b>CSV</b>: Any CSV file; you tell it which columns hold the question and the answer.</li></ul>'
 +'<h3>Data preparation details</h3>'
 +'<h4>Cleaning and deduplication</h4>'
 +'<p>Duplicate examples (after normalising whitespace) are removed. Malformed rows (empty fields, unknown format) are dropped with a reason shown in results.</p>'
 +'<h4>Decontamination</h4>'
 +'<p>Any training example whose text appears in your test files is <b>removed</b>. This keeps your evaluation scores honest: the model never sees its test examples during training.</p>'
 +'<h4>Splitting</h4>'
 +'<p>Data is split into a large <b>train</b> set and a small <b>validation</b> set. If validation loss rises while train loss falls, the model is memorizing: retrain with fewer epochs.</p>'

 +'<tr><th>Parameter</th><th>What it controls</th></tr>'

 +'<tr><td><b>max_seq_len</b></td><td>Longest example allowed. Lower = less GPU memory. 2048 is a good default.</td></tr>'
